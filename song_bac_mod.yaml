# Sòng Bạc Tu Sĩ: đè cơ chế sòng bạc gốc bằng đổ thạch, xúc xắc đại tiểu và vay nợ.
# Không có nội dung YAML: mọi thứ chạy bằng main.js. Đổi id ở đây thì phải đổi cả ở main.js.
id: song_bac
name: Sòng Bạc Tu Sĩ
version: 1.0.0
api_version: 1
author: Bạn
description: |
  Thay màn sòng bạc đơn điệu bằng ba trò thuần may rủi: đổ thạch (mua đá, mài ra vật phẩm bất kỳ,
  đá càng đắt càng dễ ra phẩm cao), xúc xắc đặt đại / tiểu (cược tùy ý), và vay nợ để đánh bạc
  (lãi chồng theo nhịp thế giới, quá hạn bị đòi nợ). Mở tự động khi bước vào sòng bạc.

options:
  - key: che_do
    label: Màn sòng bạc gốc
    hint: Thay = bỏ bốn lựa chọn cược gốc (ev.song_bac_chieu_bac), chỉ còn nút rời đi, bàn cược của mod hiện thế chỗ. Giữ = để nguyên lựa chọn gốc, bàn cược của mod mở thêm.
    type: choice
    default: thay
    choices:
      - { value: thay, label: Thay bằng bàn cược của mod }
      - { value: giu, label: Giữ lựa chọn gốc }
    files:
      thay: [content/patch/thay_goc.yaml]
  - key: loi_nha
    label: Lợi nhà cái ở đổ thạch
    hint: Giá đá = giá trị kỳ vọng của vật mài ra, cộng thêm chừng này (0,15 = +15%). Tăng thì đá đắt hơn, người chơi lỗ nhiều hơn.
    type: number
    default: 0.15
    min: 0
    max: 1
    step: 0.05
  - key: lai_suat
    label: Lãi vay mỗi nhịp thế giới (5 năm)
    hint: Nợ nhân thêm chừng này mỗi nhịp (0,15 = 15%). Quá hạn thì lãi gấp đôi.
    type: number
    default: 0.15
    min: 0.05
    max: 0.5
    step: 0.05
  - key: thang_cuoc
    label: Thang tiền
    hint: Nhân hạn mức vay. Nếu linh thạch trong game lớn / nhỏ hơn dự tính thì chỉnh ở đây.
    type: number
    default: 1
    min: 0.1
    max: 10
    step: 0.1
  - key: tu_mo
    label: Tự mở bàn cược khi vào sòng bạc
    type: bool
    default: true
  - key: moi_noi
    label: Cho đánh bạc ở mọi nơi (để thử)
    hint: Bình thường chỉ đánh được khi đang đứng trong sòng bạc.
    type: bool
    default: false

script: main.js
